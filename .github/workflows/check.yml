name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: node --test tests/profiles.test.cjs tests/mcp-probe.test.mjs tests/inventory-integrations.test.mjs tests/failure-report.test.mjs
      - run: python scripts/package.py
      - run: python tests/check_package_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Native2-HOMOLOGACAO
          path: |
            dist/Codex-Native2-v*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Write-Output; $failed = $true }
          }
          if ($failed) { exit 1 }
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Configurar-Native2-GUI.ps1 -CheckOnly
          if (-not $?) { exit 1 }
          $result = & ./scripts/Vincular-ChatGPT.ps1 -Json | ConvertFrom-Json
          if ($result.chatgptToolCatalog -ne 'not_verified' -or $result.codexExecFromChatGPT -ne 'not_verified' -or $result.chatgptPlanMcpEntitlement -ne 'not_verified' -or $result.tunnelWorkspaceAssociation -ne 'not_verified') { throw 'Remote checks must never be claimed by local preflight' }
          if (($result | ConvertTo-Json) -match 'tunnel_[a-f0-9]{32}') { throw 'Tunnel ID exposed in output' }
          $plus = & ./scripts/Vincular-ChatGPT.ps1 -Json -ChatGPTPlan Plus | ConvertFrom-Json
          if ($plus.reportedChatGPTPlan -ne 'Plus' -or $plus.fullMcpFromReportedPlan -ne 'not_available_on_plan') { throw 'Plus must not claim full MCP entitlement' }
          if ($plus.chatgptPlanMcpEntitlement -ne 'not_verified' -or $plus.codexExecFromChatGPT -ne 'not_verified') { throw 'Manual plan report must not claim remote verification' }
          $business = & ./scripts/Vincular-ChatGPT.ps1 -Json -ChatGPTPlan Business | ConvertFrom-Json
          if ($business.fullMcpFromReportedPlan -ne 'eligible_if_workspace_authorized' -or $business.chatgptPlanMcpEntitlement -ne 'not_verified') { throw 'Business still requires workspace authorization' }
          $transport = & ./scripts/Selecionar-Transporte.ps1 -Mode Auto -Action Inspect -Json | ConvertFrom-Json
          if ($transport.chatgptToolsExposed -ne 'not_verified' -or $transport.remoteExecution -ne 'not_verified') { throw 'Transport must not claim ChatGPT execution' }
          $online = & ./scripts/Selecionar-Transporte.ps1 -Mode Online -Action Inspect -Json | ConvertFrom-Json
          if ($online.transportConfigured -or $online.tunnelAuthenticated -ne 'not_verified') { throw 'Inspect must be read-only and not claim remote readiness' }
          & ./tests/transport-selection.test.ps1
          if (-not $?) { throw 'transport-selection.test.ps1 failed' }
          & ./tests/registration-throttle.test.ps1
          if (-not $?) { throw 'registration-throttle.test.ps1 failed' }
