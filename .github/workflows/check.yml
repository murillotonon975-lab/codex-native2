name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: node --test tests/profiles.test.cjs tests/mcp-probe.test.mjs tests/inventory-integrations.test.mjs
      - run: python scripts/package.py
      - run: python tests/check_package_assets.py
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Write-Output; $failed = $true }
          }
          if ($failed) { exit 1 }
      - shell: powershell
        run: |
          & ./scripts/Configurar-Native2-GUI.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $result = & ./scripts/Vincular-ChatGPT.ps1 -Json | ConvertFrom-Json
          if ($result.chatgptToolCatalog -ne 'not_verified' -or $result.codexExecFromChatGPT -ne 'not_verified') { throw 'Remote checks must never be claimed by local preflight' }
          if (($result | ConvertTo-Json) -match 'tunnel_[a-f0-9]{32}') { throw 'Tunnel ID exposed in output' }
